services:
  - type: web
    name: canvas-flow
    runtime: node
    region: oregon
    plan: free
    buildCommand: cd frontend && npm install && npm run build && cd ../backend && npm install && npm run build
    startCommand: cd backend && node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: CANVAS_BASE_URL
        sync: false
      - key: CANVAS_TOKEN
        sync: false
      - key: API_SECRET
        generateValue: true
      - key: PORT
        value: 10000
